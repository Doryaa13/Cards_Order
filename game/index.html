<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>תגובת שרשרת</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1 id="level-name">תגובת שרשרת</h1>
  </header>
  <main id="stage">
    <canvas id="canvas"></canvas>
    <div id="win" class="win" hidden>
      <div class="win-card">
        <p class="win-title">הצלחת!</p>
        <p id="win-stars" class="win-stars" aria-label="כוכבים"></p>
        <p id="win-text" class="win-text"></p>
        <button id="btn-again" class="btn primary">↺ שחקו שוב</button>
      </div>
    </div>
  </main>
  <footer class="dock">
    <div id="tray" class="tray" aria-label="מאגר חלקים"></div>
    <p id="status" class="status">&nbsp;</p>
    <div class="controls">
      <button id="btn-play" class="btn primary">▶ הפעל</button>
      <button id="btn-reset" class="btn">↺ אפס</button>
    </div>
  </footer>

  <script src="vendor/matter.min.js"></script>
  <script src="js/world.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/level1.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
